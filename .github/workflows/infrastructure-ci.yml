name: Infrastructure CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-quality:
    name: Infrastructure quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Keycloak realm configuration
        run: jq empty infrastructure/keycloak/poultryflow-realm.json
      - name: Validate infrastructure shell syntax
        run: bash -n infrastructure/postgres/init/01-create-keycloak-database.sh
