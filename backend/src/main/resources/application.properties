spring.application.name=PoultryFlow

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${POULTRYFLOW_OIDC_ISSUER_URI:http://localhost:8081/realms/poultryflow}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${POULTRYFLOW_OIDC_JWK_SET_URI:http://localhost:8081/realms/poultryflow/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${POULTRYFLOW_OIDC_AUDIENCE:poultryflow-api}

spring.datasource.url=${POULTRYFLOW_DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:poultryflow}}
spring.datasource.username=${POULTRYFLOW_DATABASE_USERNAME:${POSTGRES_USER:poultryflow_dev}}
spring.datasource.password=${POULTRYFLOW_DATABASE_PASSWORD:${POSTGRES_PASSWORD:dev-only-poultryflow-password}}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
